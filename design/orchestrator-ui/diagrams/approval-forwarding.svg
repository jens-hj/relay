<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290" font-family="'Geist Mono',ui-monospace,Menlo,monospace"><rect width="760" height="290" fill="#0D0D0F"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5A5960"/></marker></defs><text x="24" y="34" font-size="14" font-weight="600" fill="#EDEBE6" text-anchor="start">A sub-agent's approval climbs to you; your answer comes straight back</text><g fill="none" stroke="#5A5960" stroke-width="1.2"><path d="M184.0 116H208.0" marker-end="url(#a)"/><path d="M368.0 116H392.0" marker-end="url(#a)"/><path d="M552.0 116H576.0" marker-end="url(#a)"/><path d="M656 152.0V214" marker-end="url(#a)"/><path d="M576.0 238H104V152.0" marker-end="url(#a)"/></g><rect x="24.0" y="80.0" width="160" height="72" fill="#E3B266" fill-opacity="0.12" stroke="#E3B266" stroke-width="1.5"/><text x="104" y="104" font-size="13" font-weight="600" fill="#EDEBE6" text-anchor="middle">Write migrations</text><text x="104" y="122" font-size="11" font-weight="400" fill="#8F8C86" text-anchor="middle">sub-agent, waiting</text><text x="104" y="138" font-size="11" font-weight="400" fill="#8F8C86" text-anchor="middle">hits an ask rule</text><rect x="208.0" y="80.0" width="160" height="72" fill="none" fill-opacity="1" stroke="#5A5960" stroke-width="1.2"/><text x="288" y="104" font-size="13" font-weight="600" fill="#EDEBE6" text-anchor="middle">API migration</text><text x="288" y="122" font-size="11" font-weight="400" fill="#8F8C86" text-anchor="middle">manager</text><text x="288" y="138" font-size="11" font-weight="400" fill="#8F8C86" text-anchor="middle">Approval call appears</text><rect x="392.0" y="80.0" width="160" height="72" fill="none" fill-opacity="1" stroke="#5A5960" stroke-width="1.2"/><text x="472" y="104" font-size="13" font-weight="600" fill="#EDEBE6" text-anchor="middle">Release 2.4</text><text x="472" y="122" font-size="11" font-weight="400" fill="#8F8C86" text-anchor="middle">director, collapsed</text><text x="472" y="138" font-size="11" font-weight="400" fill="#8F8C86" text-anchor="middle">status bar: 1 waiting</text><rect x="576.0" y="80.0" width="160" height="72" fill="#E3B266" fill-opacity="0.12" stroke="#E3B266" stroke-width="1.5"/><text x="656" y="104" font-size="13" font-weight="600" fill="#EDEBE6" text-anchor="middle">Needs you</text><text x="656" y="122" font-size="11" font-weight="400" fill="#8F8C86" text-anchor="middle">pinned in the sidebar</text><text x="656" y="138" font-size="11" font-weight="400" fill="#8F8C86" text-anchor="middle">shown with its path</text><rect x="576.0" y="214.0" width="160" height="48" fill="none" fill-opacity="1" stroke="#5A5960" stroke-width="1.2"/><text x="656" y="242" font-size="12" font-weight="600" fill="#EDEBE6" text-anchor="middle">You approve or reject</text><text x="340.0" y="230" font-size="11" font-weight="400" fill="#8F8C86" text-anchor="middle">resolved everywhere at once: approve unblocks it, reject stops it</text></svg>