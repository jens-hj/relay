[package]
name = "relay-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
relay-core.workspace = true
mosaic.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
reqwest.workspace = true
futures-util.workspace = true
uuid.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
percent-encoding = "2.3"

[package.metadata.mosaic]
name = "Relay"
bundle-id = "dev.unincorporated.relay"
targets = ["desktop", "web"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio.workspace = true
tokio-tungstenite.workspace = true
arboard = { version = "3.6.1", features = ["image-data", "wayland-data-control"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.48", default-features = false, features = ["sync", "macros"] }
wasm-bindgen = "=0.2.121"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Location", "Storage", "Document", "HtmlInputElement", "HtmlElement", "Event", "EventTarget", "ClipboardEvent", "DataTransfer", "FileList", "File", "Blob"] }
gloo-net = { version = "0.6", default-features = false, features = ["websocket"] }
gloo-timers = { version = "0.3", features = ["futures"] }
web-time = "1"
uuid = { version = "1.18", features = ["v4", "js"] }
